<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Bike Computer</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="topbar">
        <div class="gps-status" id="gps-status">
            <span class="dot" id="gps-dot"></span>
            <span id="gps-text">GPS OFF</span>
        </div>
        <div class="topbar-right">
            <span class="gps-accuracy" id="gps-accuracy">--</span>
            <span class="battery hidden" id="battery"><span class="battery-icon"><span class="battery-level" id="battery-level"></span></span><span id="battery-text"></span></span>
        </div>
    </header>

    <div id="map-panel" class="map-panel">
        <div id="map"></div>
    </div>

    <main class="dashboard">
        <section class="speed-panel">
            <div class="speed-value" id="speed-value">0.0</div>
            <div class="speed-unit">km/h</div>
            <div class="system-clock" id="system-clock">--:--</div>
        </section>

        <section class="row distance-time">
            <div class="metric">
                <div class="metric-value" id="distance-value">0.00</div>
                <div class="metric-label">km · DISTANCE</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="time-value">00:00:00</div>
                <div class="metric-label">RIDE TIME</div>
            </div>
        </section>

        <section class="row secondary">
            <div class="metric">
                <div class="metric-value" id="avg-speed-value">--</div>
                <div class="metric-label">AVG</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="max-speed-value">--</div>
                <div class="metric-label">MAX</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="moving-time-value">00:00:00</div>
                <div class="metric-label">MOVING</div>
            </div>
        </section>

        <section class="row secondary">
            <div class="metric">
                <div class="metric-value" id="elevation-value">--</div>
                <div class="metric-label">ELEV m</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="gain-value">--</div>
                <div class="metric-label">GAIN m</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="loss-value">--</div>
                <div class="metric-label">LOSS m</div>
            </div>
        </section>
    </main>

    <footer class="controls">
        <button id="btn-start" class="btn btn-start">START</button>
        <button id="btn-pause" class="btn btn-pause hidden">PAUSE</button>
        <button id="btn-resume" class="btn btn-resume hidden">RESUME</button>
        <button id="btn-stop" class="btn btn-stop hidden">STOP</button>
        <button id="btn-sun" class="btn btn-sun">SUN</button>
        <button id="btn-full" class="btn btn-fullscreen">FULL</button>
        <button id="btn-wide" class="btn btn-fullscreen">WIDE</button>
    </footer>

    <div id="permission-banner" class="permission-banner hidden">
        Location access is required to calculate speed, distance, and elevation.
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/gps.js"></script>
    <script src="js/ride.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
