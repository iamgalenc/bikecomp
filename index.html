<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Bike Computer</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="topbar">
        <div class="gps-status" id="gps-status">
            <span class="dot" id="gps-dot"></span>
            <span id="gps-text">GPS OFF</span>
        </div>
        <div class="topbar-right">
            <span class="gps-accuracy" id="gps-accuracy">--</span>
            <span class="battery hidden" id="battery"><span class="battery-icon"><span class="battery-level" id="battery-level"></span></span><span id="battery-text"></span></span>
        </div>
    </header>

    <div id="map-panel" class="map-panel">
        <div id="map"></div>
    </div>

    <main class="dashboard">
        <section class="speed-hero">
            <div class="speed-value" id="speed-value">0.0</div>
            <div class="speed-sub"><span class="speed-unit">km/h</span><span class="system-clock" id="system-clock">--:--</span></div>
        </section>

        <section class="stat-strip">
            <div class="stat">
                <div class="stat-value" id="distance-value">0.00</div>
                <div class="stat-label">km</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="time-value">00:00:00</div>
                <div class="stat-label">ride</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="moving-time-value">00:00:00</div>
                <div class="stat-label">moving</div>
            </div>
        </section>

        <section class="substats">
            <span>avg <b id="avg-speed-value">--</b></span>
            <span>max <b id="max-speed-value">--</b></span>
            <span>elev <b id="elevation-value">--</b> m</span>
            <span>&#9650;<b id="gain-value">--</b></span>
            <span>&#9660;<b id="loss-value">--</b></span>
        </section>
    </main>

    <footer class="controls">
        <button id="btn-start" class="btn btn-start icon-btn" title="Start" aria-label="Start">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="btn-pause" class="btn btn-pause icon-btn hidden" title="Pause" aria-label="Pause">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button id="btn-resume" class="btn btn-resume icon-btn hidden" title="Resume" aria-label="Resume">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="btn-stop" class="btn btn-stop icon-btn hidden" title="Stop" aria-label="Stop">
            <svg width="22" height="22" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
        </button>
        <button id="btn-sun" class="btn btn-sun icon-btn" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">
            <svg class="icon-moon" width="22" height="22" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="icon-sun" width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-full" class="btn btn-fullscreen icon-btn" title="Fullscreen portrait" aria-label="Fullscreen portrait">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7zM5 10h2V7h3V5H5zm12 7h-3v2h5v-5h-2zM14 5v2h3v3h2V5z"/></svg>
        </button>
        <button id="btn-wide" class="btn btn-fullscreen icon-btn" title="Fullscreen landscape" aria-label="Fullscreen landscape">
            <svg width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2" fill="none" stroke-width="2"/><circle cx="12" cy="12" r="2.5"/></svg>
        </button>
    </footer>

    <div id="permission-banner" class="permission-banner hidden">
        Location access is required to calculate speed, distance, and elevation.
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/gps.js?v=2"></script>
    <script src="js/ride.js?v=2"></script>
    <script src="js/ui.js?v=2"></script>
    <script src="js/map.js?v=2"></script>
    <script src="js/app.js?v=2"></script>
</body>
</html>
